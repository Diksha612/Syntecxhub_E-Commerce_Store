services:
  mongo: { image: mongo:7, volumes: [mongo:/data/db] }
  server:
    build: ./server
    env_file: ./server/.env
    environment: { MONGO_URI: "mongodb://mongo:27017/smartmart" }
    ports: ["5000:5000"]
    volumes: [uploads:/app/uploads]
    depends_on: [mongo]
  client:
    build: { context: ./client, args: { VITE_API_URL: "http://localhost:5000/api" } }
    ports: ["5173:80"]
volumes: { mongo: {}, uploads: {} }
